name: Windows CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  quality-gate:
    name: Lint, test, coverage, and package
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      MTPDFLOGO_NO_PAUSE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies through installer
        shell: cmd
        run: |
          set MTPDFLOGO_NO_PAUSE=1
          install.bat

      - name: Runtime import smoke
        shell: cmd
        run: |
          .venv\Scripts\python.exe -m pip check
          .venv\Scripts\python.exe -c "import fitz, PySide6, PIL, mtpdflogo; from mtpdflogo.config.resources import config_path, font_directory; assert config_path().exists(); assert font_directory().exists(); print('runtime smoke ok')"

      - name: Install developer dependencies
        shell: cmd
        run: .venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Ruff
        shell: cmd
        run: .venv\Scripts\python.exe -m ruff check app tests

      - name: Pytest with coverage gate
        shell: cmd
        env:
          PYTHONPATH: ${{ github.workspace }}\app
        run: .venv\Scripts\python.exe -m pytest -q

      - name: Build installer zip
        shell: cmd
        run: build.bat

      - name: Clean-machine installer smoke from zip
        shell: cmd
        run: .venv\Scripts\python.exe -m pytest tests\smoke -q --no-cov --run-installer-smoke --installer-zip dist\MTPDFLogo-installer.zip

      - name: Verify installer zip contract
        shell: pwsh
        run: |
          $zip = Join-Path $PWD 'dist\MTPDFLogo-installer.zip'
          if (!(Test-Path -LiteralPath $zip)) { throw "installer zip not found: $zip" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names = $archive.Entries | ForEach-Object { $_.FullName }
            $required = @(
              'MTPDFLogo/install.bat',
              'MTPDFLogo/start.bat',
              'MTPDFLogo/start-debug.bat',
              'MTPDFLogo/install.sh',
              'MTPDFLogo/start.sh',
              'MTPDFLogo/pyproject.toml',
              'MTPDFLogo/app/mtpdflogo/__main__.py',
              'MTPDFLogo/app/mtpdflogo/resources/config/app.toml',
              'MTPDFLogo/app/mtpdflogo/resources/assets/fonts/Mali/Mali-Regular.ttf'
            )
            foreach ($entry in $required) {
              if ($names -notcontains $entry) { throw "missing zip entry: $entry" }
            }
            $bad = $names | Where-Object { $_ -match '(^|/)\.venv(/|$)|__pycache__|\.pyc$|\.pytest_cache|\.ruff_cache' }
            if ($bad.Count -gt 0) { throw "zip contains forbidden entries: $($bad -join ', ')" }
          }
          finally {
            $archive.Dispose()
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MTPDFLogo-installer
          path: dist/MTPDFLogo-installer.zip

name: Linux CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  headless-quality-gate:
    name: Headless tests and launcher contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime and developer dependencies
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Runtime import smoke
        run: |
          .venv/bin/python -m pip check
          .venv/bin/python -c "import fitz, PySide6, PIL, mtpdflogo; from mtpdflogo.config.resources import config_path, font_directory; assert config_path().exists(); assert font_directory().exists(); print('linux runtime smoke ok')"

      - name: Ruff
        run: .venv/bin/python -m ruff check app tests

      - name: Pytest with coverage gate
        env:
          PYTHONPATH: ${{ github.workspace }}/app
        run: .venv/bin/python -m pytest -q

      - name: Launcher scripts are present
        run: |
          test -f install.sh
          test -f start.sh
          grep -q 'python3.12' install.sh
          grep -q '.venv/bin/python' start.sh

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mtpdflogo"
version = "0.1.0"
description = "High-performance cross-platform PDF text and logo overlay application"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyMuPDF>=1.24,<2",
    "PySide6>=6.7,<7",
    "Pillow>=10,<12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-qt>=4,<5",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[project.scripts]
mtpdflogo = "mtpdflogo.__main__:main"

[tool.setuptools]
package-dir = {"" = "app"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.package-data]
mtpdflogo = [
    "resources/config/*.toml",
    "resources/assets/fonts/**/*.ttf",
    "resources/assets/fonts/**/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
